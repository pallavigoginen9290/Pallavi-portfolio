<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#576cbc" />
      <stop offset="100%" stop-color="#19376d" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b2447" />
      <stop offset="100%" stop-color="#04152d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background decorative glow -->
  <circle cx="250" cy="200" r="160" fill="url(#aboutGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- Laptop Base & Screen -->
  <rect x="100" y="80" width="300" height="200" rx="16" fill="url(#aboutGrad)" stroke="#576cbc" stroke-width="3" />
  <rect x="115" y="95" width="270" height="170" rx="8" fill="url(#screenGrad)" />
  
  <!-- Code Editor UI on screen -->
  <circle cx="130" cy="110" r="4" fill="#ff5f56" />
  <circle cx="142" cy="110" r="4" fill="#ffbd2e" />
  <circle cx="154" cy="110" r="4" fill="#27c93f" />

  <!-- Code syntax lines -->
  <rect x="130" y="130" width="60" height="8" rx="4" fill="#576cbc" />
  <rect x="200" y="130" width="90" height="8" rx="4" fill="#5bc0be" />
  
  <rect x="150" y="150" width="120" height="8" rx="4" fill="#6fffe9" />
  <rect x="150" y="170" width="80" height="8" rx="4" fill="#ffbd2e" />
  <rect x="240" y="170" width="70" height="8" rx="4" fill="#576cbc" />

  <rect x="150" y="190" width="140" height="8" rx="4" fill="#5bc0be" />
  <rect x="150" y="210" width="100" height="8" rx="4" fill="#576cbc" />
  <rect x="130" y="230" width="40" height="8" rx="4" fill="#ff5f56" />

  <!-- Laptop stand/keyboard base -->
  <path d="M 60 280 L 440 280 L 410 305 L 90 305 Z" fill="#19376d" stroke="#576cbc" stroke-width="2" />
  <rect x="210" y="284" width="80" height="6" rx="3" fill="#576cbc" opacity="0.6" />

  <!-- Floating Tech Elements -->
  <circle cx="80" cy="130" r="28" fill="#19376d" stroke="#576cbc" stroke-width="2" />
  <text x="80" y="136" font-family="'Roboto', sans-serif" font-size="14" font-weight="bold" fill="#6fffe9" text-anchor="middle">&lt;/&gt;</text>

  <circle cx="420" cy="140" r="28" fill="#19376d" stroke="#576cbc" stroke-width="2" />
  <text x="420" y="146" font-family="'Roboto', sans-serif" font-size="14" font-weight="bold" fill="#ffbd2e" text-anchor="middle">SQL</text>

  <circle cx="410" cy="270" r="24" fill="#19376d" stroke="#576cbc" stroke-width="2" />
  <text x="410" y="275" font-family="'Roboto', sans-serif" font-size="12" font-weight="bold" fill="#a5d7e8" text-anchor="middle">{ }</text>
</svg>
