<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#576cbc" />
      <stop offset="50%" stop-color="#19376d" />
      <stop offset="100%" stop-color="#0b2447" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fffe9" />
      <stop offset="100%" stop-color="#576cbc" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#576cbc" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#19376d" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#030b1e" stop-opacity="0" />
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes rotateLeftThenRight {
      0% {
        transform: rotate(0deg);
      }
      50% {
        /* Rotate left (counter-clockwise) for 30 seconds */
        transform: rotate(-360deg);
      }
      100% {
        /* Rotate right (clockwise) for 30 seconds back */
        transform: rotate(0deg);
      }
    }

    .rotatingOuterRings {
      transform-origin: 260px 260px;
      animation: rotateLeftThenRight 60s linear infinite;
    }

    @keyframes badgeFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    .floatingBadge {
      animation: badgeFloat 4s ease-in-out infinite;
    }
  </style>

  <!-- Ambient background glowing halo -->
  <circle cx="260" cy="260" r="235" fill="url(#halo)" />

  <!-- Outer tech lines group: Rotates left 30s and right 30s continuously -->
  <g class="rotatingOuterRings">
    <!-- Outermost orbit ring with wide dashes -->
    <circle cx="260" cy="260" r="220" fill="none" stroke="#6fffe9" stroke-width="1.8" stroke-dasharray="14 18 4 18" opacity="0.65" />
    <!-- Secondary dashed tech ring -->
    <circle cx="260" cy="260" r="202" fill="none" stroke="#576cbc" stroke-width="2.5" stroke-dasharray="10 14" opacity="0.75" />
    <!-- Fine inner dashed ring -->
    <circle cx="260" cy="260" r="184" fill="none" stroke="#a5d7e8" stroke-width="1.5" stroke-dasharray="6 8 2 8" opacity="0.5" />
    
    <!-- Decorative orbit node dots -->
    <circle cx="260" cy="40" r="4.5" fill="#6fffe9" />
    <circle cx="480" cy="260" r="4.5" fill="#ffd43b" />
    <circle cx="260" cy="480" r="4.5" fill="#6fffe9" />
    <circle cx="40" cy="260" r="4.5" fill="#3ecf8e" />
    
    <!-- Diagonal tick marks -->
    <circle cx="104" cy="104" r="3" fill="#a5d7e8" opacity="0.7" />
    <circle cx="416" cy="104" r="3" fill="#a5d7e8" opacity="0.7" />
    <circle cx="416" cy="416" r="3" fill="#a5d7e8" opacity="0.7" />
    <circle cx="104" cy="416" r="3" fill="#a5d7e8" opacity="0.7" />
  </g>

  <!-- Main avatar core circle -->
  <circle cx="260" cy="260" r="168" fill="url(#avatarGrad)" stroke="#576cbc" stroke-width="4" />

  <!-- Long hair background -->
  <path d="M 195 210 Q 190 320 230 360 L 290 360 Q 330 320 325 210 Z" fill="#1b1c2b" />

  <!-- Neck -->
  <rect x="240" y="270" width="40" height="45" fill="#e8b298" rx="6" />

  <!-- Shoulders & Outfit -->
  <path d="M 180 390 C 180 320 220 305 260 305 C 300 305 340 320 340 390 Z" fill="#0b2447" stroke="#576cbc" stroke-width="2.5" />
  <!-- Inner shirt collar -->
  <path d="M 235 305 L 260 340 L 285 305 Z" fill="#576cbc" />

  <!-- Face -->
  <ellipse cx="260" cy="225" rx="46" ry="52" fill="#ffcbb0" />

  <!-- Hair front bangs -->
  <path d="M 214 210 C 214 165 240 155 260 155 C 285 155 306 165 306 210 C 290 185 275 190 260 185 C 245 190 230 185 214 210 Z" fill="#2d2238" />

  <!-- Eyes & Eyebrows -->
  <ellipse cx="242" cy="225" rx="5" ry="6" fill="#1b1c2b" />
  <ellipse cx="278" cy="225" rx="5" ry="6" fill="#1b1c2b" />
  <circle cx="244" cy="223" r="1.5" fill="#ffffff" />
  <circle cx="280" cy="223" r="1.5" fill="#ffffff" />
  <path d="M 235 214 Q 242 210 250 213" fill="none" stroke="#2d2238" stroke-width="2" stroke-linecap="round" />
  <path d="M 270 213 Q 278 210 285 214" fill="none" stroke="#2d2238" stroke-width="2" stroke-linecap="round" />

  <!-- Friendly Smile -->
  <path d="M 250 250 Q 260 258 270 250" fill="none" stroke="#d05353" stroke-width="2.5" stroke-linecap="round" />

  <!-- Modern Glasses -->
  <rect x="232" y="217" width="22" height="16" rx="4" fill="none" stroke="#6fffe9" stroke-width="2" />
  <rect x="266" y="217" width="22" height="16" rx="4" fill="none" stroke="#6fffe9" stroke-width="2" />
  <line x1="254" y1="223" x2="266" y2="223" stroke="#6fffe9" stroke-width="2" />

  <!-- Floating Tech Badges (Resume Tech Stack) with Drop Shadow -->
  <!-- Java Badge -->
  <g class="floatingBadge" transform="translate(60, 180)" filter="url(#badgeShadow)">
    <rect width="84" height="34" rx="17" fill="#0b2447" stroke="#6fffe9" stroke-width="1.8" />
    <text x="42" y="22" font-family="'Space Grotesk', 'Roboto', sans-serif" font-size="13" font-weight="bold" fill="#6fffe9" text-anchor="middle">⚡ Java</text>
  </g>

  <!-- Python Badge -->
  <g class="floatingBadge" transform="translate(370, 180)" filter="url(#badgeShadow)">
    <rect width="94" height="34" rx="17" fill="#0b2447" stroke="#ffd43b" stroke-width="1.8" />
    <text x="47" y="22" font-family="'Space Grotesk', 'Roboto', sans-serif" font-size="13" font-weight="bold" fill="#ffd43b" text-anchor="middle">🐍 Python</text>
  </g>

  <!-- Supabase Badge -->
  <g class="floatingBadge" transform="translate(75, 325)" filter="url(#badgeShadow)">
    <rect width="102" height="34" rx="17" fill="#0b2447" stroke="#3ecf8e" stroke-width="1.8" />
    <text x="51" y="22" font-family="'Space Grotesk', 'Roboto', sans-serif" font-size="13" font-weight="bold" fill="#3ecf8e" text-anchor="middle">⚡ Supabase</text>
  </g>

  <!-- SQL Badge -->
  <g class="floatingBadge" transform="translate(365, 325)" filter="url(#badgeShadow)">
    <rect width="84" height="34" rx="17" fill="#0b2447" stroke="#a5d7e8" stroke-width="1.8" />
    <text x="42" y="22" font-family="'Space Grotesk', 'Roboto', sans-serif" font-size="13" font-weight="bold" fill="#a5d7e8" text-anchor="middle">🗄 SQL</text>
  </g>
</svg>
